name: Build DialogQCA Windows

on:
  workflow_dispatch:
    inputs:
      dialogforge_ref:
        description: DialogForge branch, tag, or commit SHA.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v5
        with:
          path: product

      - name: Check out DialogForge
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DIALOGFORGE_REPOSITORY || 'dusadrian/DialogForge' }}
          ref: ${{ inputs.dialogforge_ref != '' && inputs.dialogforge_ref || vars.DIALOGFORGE_REF || 'main' }}
          path: DialogForge

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DialogForge/package-lock.json

      - name: Install DialogForge dependencies
        working-directory: DialogForge
        run: npm ci

      - name: Build Windows artifact
        working-directory: product
        run: npm run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialogqca-windows
          path: DialogForge/build/output/*.exe
          if-no-files-found: error
