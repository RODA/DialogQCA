name: Build DialogQCA macOS

on:
  workflow_dispatch:
    inputs:
      dialogforge_ref:
        description: DialogForge branch, tag, or commit SHA.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - name: Check out product
        uses: actions/checkout@v5

      - name: Check out DialogForge
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DIALOGFORGE_REPOSITORY || 'dusadrian/DialogForge' }}
          ref: ${{ inputs.dialogforge_ref != '' && inputs.dialogforge_ref || vars.DIALOGFORGE_REF || 'main' }}
          path: DialogForge

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DialogForge/package-lock.json

      - name: Install DialogForge dependencies
        working-directory: DialogForge
        run: npm ci

      - name: Build macOS artifact
        run: npm run build:macos -- --arch x64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialogqca-macos
          path: DialogForge/build/output/*.dmg
          if-no-files-found: error
